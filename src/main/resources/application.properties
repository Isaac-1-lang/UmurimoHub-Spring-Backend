spring.application.name=umurimoHub

# Server Configuration
server.port=8081

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/umurimo_v2
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=121402pr0732021

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional PostgreSQL optimizations
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Logging
logging.level.ac.cursor.umurimohub=DEBUG
logging.level.org.springframework.security=DEBUG

