spring.application.name=umurimoHub

# Server Configuration
server.port=8081

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/umurimo_v2
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=121402pr0732021

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional PostgreSQL optimizations
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Logging
logging.level.ac.cursor.umurimohub=DEBUG
logging.level.org.springframework.security=DEBUG

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=isaprecieux112@gmail.com
spring.mail.password=fpvfqlntpntiuliq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OTP Configuration
otp.expiry.minutes=10

# Frontend URL (used in credential emails)
app.frontend.url=http://localhost:8080

# Modular monolith: shared DB by default (set spring.profiles.active=modular-db for separate DBs per module)
app.multi-database.enabled=false

# Logical service registry (future extraction: each module -> own process + port + DB)
app.modules.registry.auth.port=8101
app.modules.registry.auth.database=umurimo_auth
app.modules.registry.auth.description=Authentication, users, OTP

app.modules.registry.worker.port=8102
app.modules.registry.worker.database=umurimo_worker
app.modules.registry.worker.description=Worker profiles and employment

app.modules.registry.attendance.port=8103
app.modules.registry.attendance.database=umurimo_attendance
app.modules.registry.attendance.description=Attendance records and reactive feeds

app.modules.registry.payroll.port=8104
app.modules.registry.payroll.database=umurimo_payroll
app.modules.registry.payroll.description=Salary deductions

app.modules.registry.discipline.port=8105
app.modules.registry.discipline.database=umurimo_discipline
app.modules.registry.discipline.description=Disciplinary actions

app.modules.registry.notification.port=8106
app.modules.registry.notification.database=(none)
app.modules.registry.notification.description=Email / OTP delivery

app.modules.registry.dashboard.port=8081
app.modules.registry.dashboard.database=(aggregator)
app.modules.registry.dashboard.description=BFF / read-model over module ports



# Actuators (Metrics management)

management.endpoints.web.exposure.include=*

